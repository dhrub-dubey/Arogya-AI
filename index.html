<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18b394" />
    <meta name="description" content="Arogya AI: symptom checker, medicine info, report reader and nearby hospitals, in English, Hindi and Bengali." />
    <!-- Installable app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/app_logo.png" />
    <link rel="apple-touch-icon" href="/app_logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arogya AI" />
    <title>Arogya AI</title>
    <script>
      // Apply the saved theme before the page paints (no white flash in dark mode).
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
